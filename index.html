<title>Decisiones con Valores</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: barra superior fija con código y reloj; una "sala" a la vez en una tarjeta central, que se apila en celular */
:root{
  --bg:#FBF1F7; --surface:#FFFFFF; --surface-2:#F5E9F6; --ink:#3A1D40; --muted:#755879; --line:#EAD3EA;
  --pink:#C2357B; --pink-soft:#FCDCEA; --lilac:#7D5BC4; --lilac-soft:#ECE2FA;
  --ok:#23846A; --ok-soft:#DBF2E9; --bad:#B9324A; --bad-soft:#FBE0E5; --on-accent:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
  --wall:#F9EAF2; --wall-2:#F4DFEC; --wains:#E8DAF7; --wains-2:#D8C5F0; --floor:#DCCAF0; --floor-2:#CFBBE9; --furn:#C8B0EA; --furn-2:#B79BE2; --rose:#F2BCD6; --rose-2:#E79AC0; --glass:#FFFFFF; --sky:#E3F1FB; --leaf:#A8D8C4; --leaf-2:#7FC3A8;
  --scrub:#9ED9C5; --scrub-dk:#5FB39A; --cardi:#F4E6CD; --cardi-dk:#D8C3A0; --trim:#F4A9CB; --skin:#F3C9A8; --hair:#5B3526;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1222; --surface:#291B31; --surface-2:#33233D; --ink:#F7E8F3; --muted:#C2A8C8; --line:#45324F;
  --pink:#F27AB4; --pink-soft:#4A2139; --lilac:#B9A0F0; --lilac-soft:#352A4E;
  --ok:#5FD3AE; --ok-soft:#1D3A32; --bad:#FF8B9C; --bad-soft:#47202A; --on-accent:#1C1222; --wall:#211628; --wall-2:#25192D; --wains:#2D2140; --wains-2:#382A4F; --floor:#2F2245; --floor-2:#281D3C; --furn:#44335E; --furn-2:#523E71; --rose:#5A2C47; --rose-2:#6E3657; --glass:#3A2D4A; --sky:#2A3550; --leaf:#2F5A4C; --leaf-2:#3D705E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1222; --surface:#291B31; --surface-2:#33233D; --ink:#F7E8F3; --muted:#C2A8C8; --line:#45324F;
  --pink:#F27AB4; --pink-soft:#4A2139; --lilac:#B9A0F0; --lilac-soft:#352A4E;
  --ok:#5FD3AE; --ok-soft:#1D3A32; --bad:#FF8B9C; --bad-soft:#47202A; --on-accent:#1C1222; --wall:#211628; --wall-2:#25192D; --wains:#2D2140; --wains-2:#382A4F; --floor:#2F2245; --floor-2:#281D3C; --furn:#44335E; --furn-2:#523E71; --rose:#5A2C47; --rose-2:#6E3657; --glass:#3A2D4A; --sky:#2A3550; --leaf:#2F5A4C; --leaf-2:#3D705E; color-scheme:dark }

html{font-size:17px}
html.proyector{font-size:22px}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); line-height:1.5; min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:62rem;margin:0 auto;display:flex;align-items:center;gap:.75rem 1rem;flex-wrap:wrap;
  padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--pink)}
.code{display:flex;gap:.35rem;font-family:var(--f-mono)}
.slot{min-width:2.6rem;text-align:center;padding:.15rem .4rem;border-radius:8px;border:1.5px dashed var(--line);color:var(--muted);font-size:.95rem}
.slot.got{border-style:solid;border-color:var(--pink);background:var(--pink-soft);color:var(--pink);font-weight:500}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--muted)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.25rem .7rem;font-size:.85rem}
.tog[aria-pressed="true"]{background:var(--lilac-soft);border-color:var(--lilac);color:var(--lilac)}

main{max-width:62rem;margin:0 auto;padding-block:1.5rem 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(1.1rem,3vw,2rem);box-shadow:0 10px 40px -20px color-mix(in srgb,var(--lilac) 45%,transparent)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--lilac);font-weight:700}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:800;letter-spacing:-.025em}
h1 em{font-style:normal;color:var(--pink)}
h2{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;letter-spacing:-.015em}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.lead{font-size:1.1rem;max-width:40rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:.75rem 1.4rem;background:var(--pink);color:var(--on-accent);font-weight:700;font-size:1rem}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--lilac);border:1.5px solid var(--lilac)}
.btn.small{padding:.45rem .95rem;font-size:.9rem}

/* intro */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:2rem;align-items:center}
.hero>*{min-width:0}
.door{aspect-ratio:3/4.2;max-width:100%;border-radius:18px 18px 6px 6px;background:linear-gradient(160deg,var(--lilac-soft),var(--pink-soft));
  border:2px solid var(--line);position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1rem;padding:1.2rem}
.door::after{content:"";position:absolute;right:7%;top:56%;width:.9rem;height:.9rem;border-radius:50%;background:var(--pink)}
.door .portrait{width:72%;max-width:220px;border-radius:14px;border:5px solid var(--surface);box-shadow:0 8px 24px -10px color-mix(in srgb,var(--lilac) 60%,transparent);transform:rotate(-2deg)}
.door .plate{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;background:var(--surface);padding:.3rem .7rem;border-radius:6px;color:var(--muted)}
.door .lock{display:flex;gap:.3rem;font-family:var(--f-mono);font-size:1.3rem;color:var(--ink)}
.door .lock b{width:1.6rem;height:2.1rem;display:grid;place-items:center;background:var(--surface);border-radius:6px;border:1px solid var(--line)}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.room{border:1px solid var(--line);border-radius:var(--r);padding:1rem;background:var(--surface-2);min-width:0}
.room .n{font-family:var(--f-mono);color:var(--pink);font-size:.85rem}
.room p{color:var(--muted);font-size:.92rem}
label.fld{display:flex;flex-direction:column;gap:.3rem;font-weight:700;font-size:.9rem;max-width:22rem}
input[type=text]{font:inherit;padding:.65rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
details.guide{border-top:1px solid var(--line);padding-top:1rem}
details.guide summary{cursor:pointer;font-weight:700;color:var(--lilac)}
.guide-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2rem;margin-top:1rem}
.guide-grid>div{min-width:0}
.guide ul{margin:.4rem 0 0;padding-left:1.1rem;color:var(--muted);font-size:.93rem}
.guide li{margin-bottom:.3rem}

/* sala head */
.head{display:flex;gap:1rem;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.head>div{min-width:0}
.hint{background:var(--lilac-soft);border-radius:var(--r);padding:.8rem 1rem;color:var(--ink);font-size:.95rem}
.hint b{color:var(--lilac)}
.msg{min-height:3.2rem;border-radius:var(--r);padding:.75rem 1rem;font-size:.97rem;background:var(--surface-2);color:var(--muted)}
.msg.ok{background:var(--ok-soft);color:var(--ink)}
.msg.ok b{color:var(--ok)}
.msg.bad{background:var(--bad-soft);color:var(--ink)}
.msg.bad b{color:var(--bad)}

/* sala 1 */
.tray{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.5rem .95rem;font-weight:700;font-size:.95rem}
.chip:hover{border-color:var(--pink)}
.chip.sel{background:var(--pink);border-color:var(--pink);color:var(--on-accent);transform:translateY(-2px)}
.drawers{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
.drawer{border:2px dashed var(--line);border-radius:var(--r);background:var(--surface-2);padding:.8rem .7rem;text-align:left;min-height:8.5rem;
  display:flex;flex-direction:column;gap:.45rem;min-width:0;transition:border-color .15s,background .15s}
.drawer.armed{border-color:var(--lilac);border-style:solid;background:var(--lilac-soft)}
.drawer .t{font-family:var(--f-display);font-weight:700;font-size:.98rem;line-height:1.15}
.drawer .in{display:flex;flex-wrap:wrap;gap:.3rem}
.drawer .in span{font-size:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.1rem .4rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* opciones */
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.85rem 1rem;font-weight:700;min-width:0}
.opt:hover:not(:disabled){border-color:var(--lilac)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.opt:disabled{cursor:default}

/* sala 2 */
.myth{border-radius:20px;padding:clamp(1.2rem,4vw,2.2rem);background:linear-gradient(140deg,var(--pink-soft),var(--lilac-soft));
  font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,3.5vw,1.9rem);line-height:1.2;text-wrap:balance;min-height:9rem;display:flex;align-items:center}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.mv button{border:0;border-radius:var(--r);padding:1rem;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.mv .m{background:var(--pink);color:var(--on-accent)}
.mv .v{background:var(--lilac);color:var(--on-accent)}
.dots{display:flex;gap:.3rem;flex-wrap:wrap}
.dots i{width:.7rem;height:.7rem;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--ok)}

/* sala 3 */
.case{border-left:4px solid var(--lilac);padding:.3rem 0 .3rem 1rem;font-size:1.12rem}
.case .who{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:block;margin-bottom:.2rem}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums;min-width:30rem}
th,td{padding:.4rem .6rem;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.hl{color:var(--pink);font-weight:700}
.src{font-size:.78rem;color:var(--muted)}

/* puerta y final */
.piece{font-family:var(--f-mono);font-size:clamp(2rem,7vw,3.2rem);color:var(--pink);background:var(--pink-soft);border-radius:var(--r);padding:.4rem 1.2rem;display:inline-block;letter-spacing:.15em}
.codein{font-family:var(--f-mono)!important;font-size:1.8rem!important;letter-spacing:.3em;text-transform:uppercase;text-align:center;max-width:16rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.stat{background:var(--surface-2);border-radius:var(--r);padding:.9rem;text-align:center}
.stat b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--lilac)}
.stat span{font-size:.8rem;color:var(--muted)}
ol.reflect{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.4rem}
.res{border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.3rem}
.res .tel{font-family:var(--f-mono);font-size:1.3rem;color:var(--pink);user-select:all}

/* personaje y decoración */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--wall)}
.deco svg{width:100%;height:100%;display:block}
.bar,main{position:relative;z-index:1}
.bar{z-index:5}
.guide-row{display:flex;gap:.8rem;align-items:flex-end}
.nurse{flex:0 0 auto;width:clamp(86px,13vw,124px)}
.nurse svg{width:100%;height:auto;display:block;animation:bob 3.4s ease-in-out infinite}
.mood-happy svg{animation:hop .55s ease-out, bob 3.4s ease-in-out .55s infinite}
.nurse .m{display:none}
.mood-idle .m-idle,.mood-happy .m-happy,.mood-think .m-think{display:inline}
.nurse .eye-wink{display:none}
.mood-happy .eye-wink{display:inline}
.mood-happy .eye-open{display:none}
.nurse .brow-l,.nurse .brow-r{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.mood-think .brow-l{transform:translateY(-3px) rotate(-12deg)}
.mood-happy .brow-l,.mood-happy .brow-r{transform:translateY(-2px)}
.bubble{position:relative;flex:1;min-width:0;max-width:38rem;background:var(--lilac-soft);border-radius:18px 18px 18px 4px;padding:.75rem 1rem;margin:0 0 1.2rem;font-size:1.02rem}
.bubble::before{content:"";position:absolute;left:-9px;bottom:0;border:10px solid transparent;border-right-color:var(--lilac-soft);border-bottom-color:var(--lilac-soft)}
.bubble b{display:block;font-family:var(--f-display);color:var(--lilac);font-size:.8rem;letter-spacing:.04em}
.mood-think + .bubble{background:var(--pink-soft)}
.mood-think + .bubble::before{border-right-color:var(--pink-soft);border-bottom-color:var(--pink-soft)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{30%{transform:translateY(-12px) rotate(-3deg)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
.card{position:relative;overflow:hidden}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.8s ease-in forwards;opacity:.9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}

.foot{position:relative;z-index:1;display:flex;justify-content:center;padding-block:0 2rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot p{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.5rem 1.2rem;font-size:.95rem;color:var(--muted);text-align:center;max-width:100%}
.foot b{color:var(--lilac)}
main{padding-bottom:1.5rem}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .door{max-width:16rem;aspect-ratio:auto;margin:0 auto}
  .drawers{grid-template-columns:repeat(2,1fr)}
  .drawer{min-height:6rem}
  .rooms,.guide-grid{grid-template-columns:1fr}
}
@media (max-width:520px){ .opts{grid-template-columns:1fr} .stats{grid-template-columns:1fr 1fr 1fr} .slot{min-width:2.1rem} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ---- simulador ---- */
.score{display:flex;gap:.4rem;flex-wrap:wrap}
.tm{font-size:.85rem;border-radius:999px;padding:.2rem .7rem;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tm b{font-family:var(--f-mono);color:var(--pink);margin-left:.35rem;font-variant-numeric:tabular-nums}
.tm.up{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.15);background:var(--pink-soft)}}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.6rem}
.teams input{width:100%}
.nbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:2.6rem;height:2.6rem;font-weight:700}
.nbtn[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:var(--on-accent)}
.story-cast{display:flex;gap:.6rem;align-items:flex-end}
.av{width:clamp(70px,10vw,96px);flex:0 0 auto}
.av svg{width:100%;height:auto;display:block}
.av span{display:block;text-align:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.scene{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.scene>div{min-width:0;flex:1 1 18rem}
.scene>.story-cast{flex:0 0 auto}
.scene q{display:block;font-family:var(--f-display);font-size:clamp(1.25rem,3vw,1.7rem);font-weight:700;line-height:1.25;text-wrap:balance;quotes:none}
.ask{font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:var(--pink)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.choice{border:2px solid var(--line);border-radius:18px;padding:1rem;background:var(--surface);display:flex;flex-direction:column;gap:.45rem;min-width:0}
.choice .L{font-family:var(--f-display);font-weight:800;font-size:2.2rem;color:var(--lilac);line-height:1}
.choice .tx{font-size:1.08rem;font-weight:700}
.choice .why{font-size:.93rem;color:var(--muted)}
.choice.best{border-color:var(--ok);background:var(--ok-soft)}
.choice.mid{border-color:var(--lilac);background:var(--lilac-soft)}
.choice.risk{border-color:var(--bad);background:var(--bad-soft)}
.choice .pts{align-self:flex-start;font-family:var(--f-mono);font-size:.85rem;border-radius:999px;padding:.1rem .6rem;background:var(--surface);border:1px solid var(--line)}
.who-voted{display:flex;flex-wrap:wrap;gap:.3rem}
.who-voted span{font-size:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.05rem .45rem}
.votes{border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem;background:var(--surface-2);display:flex;flex-direction:column;gap:.5rem}
.vrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.vrow .nm{font-weight:700;min-width:8rem;flex:1}
.vb{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:2.8rem;height:2.4rem;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.vb[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--on-accent)}
.timer{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums;color:var(--lilac)}
.result{border-radius:18px;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.5rem}
.result.best{background:var(--ok-soft)} .result.mid{background:var(--lilac-soft)} .result.risk{background:var(--bad-soft)}
.result h3{font-size:1.25rem}
.meter-wrap{display:flex;flex-direction:column;gap:.3rem}
.meter-wrap .lbl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-weight:700}
.meter{height:16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lilac));transition:width .9s ease}
.dato{border-left:5px solid var(--pink);background:var(--pink-soft);padding:.8rem 1rem;border-radius:0 12px 12px 0}
.dato b{color:var(--pink)}
.rank{display:flex;flex-direction:column;gap:.5rem;margin:0;padding:0;list-style:none}
.rank li{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.rank li:first-child{background:var(--pink-soft);border-color:var(--pink)}
.rank .pos{font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--lilac);width:2rem}
.rank .nm{flex:1;font-weight:700;min-width:0}
.rank .pt{font-family:var(--f-mono);font-size:1.2rem;color:var(--pink);font-variant-numeric:tabular-nums}

    .map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join('') || '<p class="src">No hay conceptos con esa palabra.</p>';

function meterHTML(){
  const S = STORIES[G.story], v = G.meter[G.story];
  return `<div class="meter-wrap"><div class="lbl"><span>${S.meterLbl}</span><span>${v}%</span></div><div class="meter"><i style="width:${v}%"></i></div></div>`;
}

function decision(){
  clearInterval(tick); G.votes = {};
  const S = STORIES[G.story], st = S.steps[G.step];
  stage.innerHTML = `<div class="stack" style="gap:1.2rem">
    <div class="head"><div class="stack" style="gap:.2rem"><div class="chap">Historia ${G.story+1} · Decisión ${G.step+1} de ${S.steps.length}</div><h2>${S.title}</h2></div>
      <div class="row"><span class="timer" id="tmr"></span><button class="btn ghost small" id="deb">Debatir 1 minuto</button></div></div>
    <div class="scene">${castHTML(st.cast)}<div><q>${st.scene}</q></div></div>
    <div class="ask">${st.ask}</div>
    <div class="choices">${st.opts.map((o,i)=>`<div class="choice"><span class="L">${L(i)}</span><span class="tx">${o.t}</span></div>`).join('')}</div>
    <div class="votes"><h3>¿Qué eligió cada equipo?</h3>
      ${G.teams.map((t,ti)=>`<div class="vrow"><span class="nm">${esc(t.name)}</span>${[0,1,2].map(i=>`<button class="vb" data-t="${ti}" data-o="${i}" aria-pressed="false" aria-label="${esc(t.name)}: opción ${L(i)}">${L(i)}</button>`).join('')}</div>`).join('')}
    </div>
    <div class="row"><button class="btn" id="rev" disabled style="opacity:.5">Ver qué pasó</button><span class="src" id="faltan">Faltan ${G.teams.length} equipos por votar.</span></div>
  </div>`;
  stage.querySelectorAll('.vb').forEach(b=>b.onclick=()=>{
    const t=+b.dataset.t; G.votes[t]=+b.dataset.o;
    stage.querySelectorAll(`.vb[data-t="${t}"]`).forEach(x=>x.setAttribute('aria-pressed', x===b));
    const left = G.teams.length - Object.keys(G.votes).length;
    const rev = document.getElementById('rev');
    rev.disabled = left>0; rev.style.opacity = left>0?.5:1;
    document.getElementById('faltan').textContent = left>0 ? `Faltan ${left} ${left===1?'equipo':'equipos'} por votar.` : '¡Listo! Ya votaron todos.';
  });
  document.getElementById('deb').onclick = () => {
    clearInterval(tick); let s=60; const el=document.getElementById('tmr');
    el.textContent='01:00';
    tick=setInterval(()=>{ s--; if(!document.body.contains(el)){clearInterval(tick);return;}
      el.textContent = s>0 ? '00:'+String(s).padStart(2,'0') : '¡Tiempo!'; if(s<=0) clearInterval(tick); },1000);
  };
  document.getElementById('rev').onclick = () => { clearInterval(tick); reveal(); goTop(); };
}

function reveal(){
  const S = STORIES[G.story], st = S.steps[G.step];
  const counts=[0,0,0]; Object.values(G.votes).forEach(o=>counts[o]++);
  const order=[0,1,2].sort((a,b)=> counts[b]-counts[a] || st.opts[b].p-st.opts[a].p);
  const maj = order[0], mo = st.opts[maj];
  const changed=[];
  G.teams.forEach((t,i)=>{ const p=st.opts[G.votes[i]].p; if(p>0){ t.pts+=p; changed.push(i);} });
  renderScore(changed);
  const delta = mo.p>=3?20: mo.p===2?10: mo.p===1?0:-20;
  const before = G.meter[G.story];
  G.meter[G.story] = Math.max(0, Math.min(100, before+delta));
  const mood = mo.p>=3?'happy':mo.p>=1?'idle':'think';
  const lines = {happy:['¡Muy buena decisión! Cuida la dignidad de todas las personas.','¡Bien! Esa decisión nace del respeto y del cuidado del otro.'],
                 idle:['No está mal, pero había una opción que cuidaba más.','Va por buen camino. Miren la opción verde.'],
                 think:['Uy… esto pasa más seguido de lo que creemos. Miremos las otras opciones.','No se preocupen: para eso estamos, para pensarlo juntos antes de que pase.']};
  const last = G.step === S.steps.length-1;
  stage.innerHTML = `<div class="stack" style="gap:1.2rem">
    <div class="chap">Historia ${G.story+1} · Decisión ${G.step+1} · La mayoría eligió ${L(maj)}</div>
    <div class="result ${cls(mo.p)}"><h3>Lo que pasó</h3><p>${mo.res}</p></div>
    <div class="meter-wrap"><div class="lbl"><span>${S.meterLbl}</span><span>${G.meter[G.story]}% (${delta>=0?'+':''}${delta})</span></div><div class="meter"><i id="mbar" style="width:${before}%"></i></div></div>
    ${guide(mood, pick(lines[mood]))}
    <div class="choices">${st.opts.map((o,i)=>`<div class="choice ${cls(o.p)}"><span class="L">${L(i)}</span>
      <span class="pts">+${o.p} ${o.p===1?'punto':'puntos'}</span>
      <span class="tx">${o.t}</span><span class="why">${o.why}</span>
      <div class="who-voted">${G.teams.filter((_,ti)=>G.votes[ti]===i).map(t=>`<span>${esc(t.name)}</span>`).join('')}</div></div>`).join('')}</div>
    <p class="dato"><b>Dato clave:</b> ${st.dato}</p>
    <div class="concepto"><span class="eyebrow">Concepto del apunte</span><h3>${st.concepto.t}</h3><p>${st.concepto.d}</p></div>
    <div class="row"><button class="btn" id="nx">${last ? 'Terminar la historia' : 'Seguir la historia'}</button></div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const m=document.getElementById('mbar'); if(m) m.style.width=G.meter[G.story]+'%'; }));
  document.getElementById('nx').onclick = () => {
    if(!last){ G.step++; decision(); }
    else storyEnd();
    goTop();
  };
}

function storyEnd(){
  const S = STORIES[G.story], v = G.meter[G.story];
  const mood = v>=80?'happy':v>=50?'idle':'think';
  const txt = v>=80 ? '¡Qué bien cuidaron a estos personajes! Cada decisión sumó.'
           : v>=50 ? 'Algunas decisiones cuidaron más que otras. Lo importante es saber que siempre hay opciones.'
           : 'Esta historia se complicó. En la vida real, siempre se puede pedir ayuda y volver a empezar.';
  const lastStory = G.story === STORIES.length-1;
  stage.innerHTML = `<div class="stack" style="gap:1.3rem">
    <div class="chap">Fin de la historia ${G.story+1}</div><h2>${S.title}</h2>
    <div class="scene">${castHTML(S.cast)}<div>${meterHTML()}</div></div>
    ${guide(mood, txt)}
    <div class="stack" style="gap:.5rem"><h3>Lo que nos llevamos</h3><ul style="margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem">${S.steps.map(s=>`<li>${s.dato}</li>`).join('')}</ul></div>
    <div class="row"><button class="btn" id="nx">Ir al consultorio de Alba</button></div></div>`;
  document.getElementById('nx').onclick = () => { quiz(0); goTop(); };
}

function afterQuiz(){
  if(G.story === STORIES.length-1) final(); else { G.story++; storyIntro(); }
  goTop();
}
function quiz(k){
  clearInterval(tick); G.votes = {};
  const Rr = QUIZ[G.story], q = Rr.qs[k];
  stage.innerHTML = `<div class="stack" style="gap:1.2rem">
    <div class="head"><div class="stack" style="gap:.2rem"><div class="chap">El consultorio de Alba · Ronda ${G.story+1} · Pregunta ${k+1} de ${Rr.qs.length}</div><h2>${Rr.title}</h2></div>
      <button class="btn ghost small" id="skip">Saltar la ronda</button></div>
    ${k===0 ? guide('happy','¡Pasen al consultorio! Antes de seguir, repasemos conceptos del apunte. Cada respuesta correcta suma 1 punto.') : guide('idle','Siguiente pregunta. Si tienen dudas, pueden abrir el glosario.')}
    <div class="ask">${q.q}</div>
    <div class="choices four">${q.o.map((o,i)=>`<div class="choice btnlike"><span class="L">${'ABCD'[i]}</span><span class="tx">${o}</span></div>`).join('')}</div>
    <div class="votes"><h3>¿Qué respondió cada equipo?</h3>
      ${G.teams.map((t,ti)=>`<div class="vrow"><span class="nm">${esc(t.name)}</span>${[0,1,2,3].map(i=>`<button class="vb" data-t="${ti}" data-o="${i}" aria-pressed="false" aria-label="${esc(t.name)}: opción ${'ABCD'[i]}">${'ABCD'[i]}</button>`).join('')}</div>`).join('')}
    </div>
    <div class="row"><button class="btn" id="rev" disabled style="opacity:.5">Ver la respuesta</button><span class="src" id="faltan">Faltan ${G.teams.length} equipos por responder.</span></div>
  </div>`;
  stage.querySelectorAll('.vb').forEach(b=>b.onclick=()=>{
    const t=+b.dataset.t; G.votes[t]=+b.dataset.o;
    stage.querySelectorAll(`.vb[data-t="${t}"]`).forEach(x=>x.setAttribute('aria-pressed', x===b));
    const left = G.teams.length - Object.keys(G.votes).length;
    const rev = document.getElementById('rev'); rev.disabled = left>0; rev.style.opacity = left>0?.5:1;
    document.getElementById('faltan').textContent = left>0 ? `Faltan ${left} ${left===1?'equipo':'equipos'} por responder.` : '¡Listo! Ya respondieron todos.';
  });
  document.getElementById('skip').onclick = afterQuiz;
  document.getElementById('rev').onclick = () => {
    const changed=[]; G.teams.forEach((t,i)=>{ if(G.votes[i]===q.a){ t.pts+=1; changed.push(i);} });
    renderScore(changed);
    const all = changed.length===G.teams.length, none = changed.length===0;
    const last = k===Rr.qs.length-1;
    stage.innerHTML = `<div class="stack" style="gap:1.2rem">
      <div class="chap">El consultorio de Alba · Ronda ${G.story+1} · Pregunta ${k+1} de ${Rr.qs.length}</div>
      <div class="ask">${q.q}</div>
      ${guide(all?'happy':none?'think':'idle', all?'¡Todos los equipos acertaron! Muy bien.':none?'Esta costó. Lean la explicación con atención.':'Algunos equipos acertaron. Repasemos por qué.')}
      <div class="choices four">${q.o.map((o,i)=>`<div class="choice ${i===q.a?'best':(Object.values(G.votes).includes(i)?'risk':'')}"><span class="L">${'ABCD'[i]}</span><span class="tx">${o}</span>
        <div class="who-voted">${G.teams.filter((_,ti)=>G.votes[ti]===i).map(t=>`<span>${esc(t.name)}${i===q.a?' +1':''}</span>`).join('')}</div></div>`).join('')}</div>
      <div class="concepto"><span class="eyebrow">Respuesta correcta: ${'ABCD'[q.a]}</span><p>${q.e}</p></div>
      <div class="row"><button class="btn" id="nx">${last ? (G.story===STORIES.length-1?'Ver resultados finales':'Siguiente historia') : 'Siguiente pregunta'}</button></div></div>`;
    document.getElementById('nx').onclick = () => { if(last) afterQuiz(); else { quiz(k+1); goTop(); } };
    goTop();
  };
}

function final(){
  const rank = G.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.pts-a.pts);
  const max = MAXPTS;
  stage.innerHTML = `<div class="stack" style="gap:1.4rem">
    <div class="eyebrow">Resultados</div><h1>¡Gracias por <em>cuidarnos</em>!</h1>
    ${guide('happy','Hoy tomaron doce decisiones y repasaron los conceptos del apunte. Ojalá recuerden estas historias cuando les toque decidir: con libertad, con información y con respeto por ustedes y por los demás.')}
    <ol class="rank">${rank.map((t,k)=>`<li><span class="pos">${k+1}</span><span class="nm">${esc(t.name)}</span><span class="pt">${t.pts} / ${max}</span></li>`).join('')}</ol>
    <div class="stack" style="gap:.6rem"><h3>Para pensar en grupo</h3><ol class="reflect">
      <li>¿Qué significa amar y respetar a otra persona? ¿Cómo se ve eso en las historias?</li>
      <li>¿Por qué esperar también es una decisión valiosa?</li>
      <li>¿Quiénes forman nuestra red de apoyo: familia, escuela, comunidad, equipos de salud?</li>
      <li>¿Qué puede hacer un amigo o una amiga cuando ve una situación como la de Flor?</li>
    </ol></div>
    <div class="res-grid">
      <div class="res"><h3>Línea Salud Sexual</h3><span class="tel">0800 222 3444</span><p class="src">Gratuita y confidencial. Información sobre métodos y derechos.</p></div>
      <div class="res"><h3>Línea 144</h3><span class="tel">144</span><p class="src">Atención por violencia de género. Las 24 horas, gratuita y confidencial.</p></div>
    </div>
    <div class="row"><button class="btn ghost" id="again">Jugar de nuevo</button></div>
  </div>`;
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const c=document.createElement('div'); c.className='confetti'; c.setAttribute('aria-hidden','true');
    const cols=['var(--pink)','var(--lilac)','var(--trim)','var(--scrub)'];
    for(let i=0;i<40;i++){ const e=document.createElement('i'); e.style.left=Math.random()*100+'%'; e.style.background=cols[i%4];
      e.style.animationDelay=(Math.random()*.8)+'s'; e.style.animationDuration=(2.2+Math.random()*1.4)+'s'; c.appendChild(e); }
    stage.appendChild(c); setTimeout(()=>c.remove(),4500);
  }
  document.getElementById('again').onclick = () => { G.teams.forEach(t=>t.pts=0); document.getElementById('score').innerHTML=''; intro(); goTop(); };
}

intro();
</script>
